name: Rebuild engine
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test
      - run: node scripts/build.mjs
      - run: node scripts/check.mjs
      - run: git diff --exit-code -- dist
